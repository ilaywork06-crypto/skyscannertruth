[project]
name = "sky-core"
version = "0.2.0"
description = "Shared infrastructure: settings, logging, Mongo, identity, errors, app factory, object storage and API models"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6", "motor>=3.6", "aioboto3>=13.2", "fastapi>=0.115"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sky_core"]
