# The client in front of your own API:
#   TRUTH_API_URL=http://<host>:<port>/ docker compose -f docker-compose.frontend.yml up --build
name: truth

services:
  web:
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_DEFAULT_CREATOR: ${TRUTH_DEFAULT_CREATOR:-}
    restart: unless-stopped
    environment:
      TRUTH_API_URL: ${TRUTH_API_URL:-http://host.docker.internal:8000/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TRUTH_PORT:-8090}:80"
