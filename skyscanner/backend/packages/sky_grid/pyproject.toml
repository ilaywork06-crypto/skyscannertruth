[project]
name = "sky-grid"
version = "0.2.0"
description = "Grid configuration generation and grid query translation to MongoDB"
requires-python = ">=3.11"
dependencies = ["sky-core", "pydantic>=2.9", "motor>=3.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sky_grid"]

[tool.uv.sources]
sky-core = { workspace = true }
