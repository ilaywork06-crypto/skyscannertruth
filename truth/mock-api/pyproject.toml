[project]
name = "truth-mock-api"
version = "2.0.0"
description = "In-memory stand-in for the external assumptions API (Truth). Python standard library only."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
truth-mock-api = "mock_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mock_api.py"]
