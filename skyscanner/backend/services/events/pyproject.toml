[project]
name = "events-service"
version = "0.2.0"
description = "Inventory of events, entities and the dynamic industry schema"
requires-python = ">=3.11"
dependencies = ["sky-core", "sky-grid", "fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events_service"]

[tool.uv.sources]
sky-core = { workspace = true }
sky-grid = { workspace = true }
