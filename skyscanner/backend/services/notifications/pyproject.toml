[project]
name = "notification-service"
version = "0.2.0"
description = "Turns the notification outbox into mails for subscribers"
requires-python = ">=3.11"
dependencies = ["sky-core", "fastapi>=0.115", "uvicorn[standard]>=0.32", "aiosmtplib>=3.0.2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[tool.uv.sources]
sky-core = { workspace = true }
