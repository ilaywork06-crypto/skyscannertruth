# Truth's web client in front of your own assumptions API:
#
#   TRUTH_API_URL=http://10.0.0.7:8000/ docker compose -f docker-compose.frontend.yml up --build
#
# The trailing slash matters: it strips the /api the client prefixes, so /api/assumption arrives as /assumption.
name: truth

services:
  web:
    build:
      context: ../..
      dockerfile: truth/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
        VITE_DEFAULT_CREATOR: ${TRUTH_DEFAULT_CREATOR:-}
    restart: unless-stopped
    environment:
      # host.docker.internal reaches a service on this machine outside Docker.
      TRUTH_API_URL: ${TRUTH_API_URL:-http://host.docker.internal:8000/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TRUTH_PORT:-8090}:80"
